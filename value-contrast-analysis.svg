<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title>Value and Contrast Analysis</title>
<desc>Original cinematic VFX frame and grayscale value analysis showing the character as the primary focal point.</desc>
<defs>
  <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#32105c"/><stop offset=".5" stop-color="#9a43ff"/><stop offset="1" stop-color="#e0d7ff"/>
  </linearGradient>
  <filter id="gray"><feColorMatrix type="saturate" values="0"/></filter>
  <filter id="glow"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1600" height="900" fill="#050505"/>
<rect x="0" y="0" width="1600" height="90" fill="#111"/>
<text x="70" y="58" fill="#fff" font-family="Arial, sans-serif" font-size="34" font-weight="700">VALUE &amp; CONTRAST ANALYSIS</text>

<!-- Original -->
<rect x="55" y="130" width="720" height="690" rx="18" fill="#000" stroke="#333"/>
<text x="90" y="180" fill="#fff" font-family="Arial, sans-serif" font-size="26" font-weight="700">ORIGINAL FRAME</text>
<rect x="55" y="205" width="720" height="430" fill="#000"/>
<rect x="55" y="205" width="720" height="55" fill="#6d2d24"/>
<path d="M230 575 L300 510 L420 505 L470 455 L555 470 L625 560 L700 590 L700 635 L210 635Z" fill="url(#floor)" filter="url(#glow)"/>
<g stroke="#ddd" stroke-width="9" fill="#080808">
  <path d="M405 300 Q430 270 455 300 L448 365 L485 430 L470 520 L440 510 L425 445 L400 515 L370 505 L385 425 L405 365Z"/>
  <circle cx="430" cy="290" r="25" fill="#111"/>
</g>
<g fill="#e7a8ff" filter="url(#glow)">
  <circle cx="520" cy="310" r="8"/><circle cx="555" cy="350" r="6"/><circle cx="590" cy="405" r="11"/><circle cx="500" cy="390" r="6"/>
</g>
<text x="90" y="690" fill="#bbb" font-family="Arial, sans-serif" font-size="22">Colour, VFX and silhouette create the visual focus.</text>
<text x="90" y="735" fill="#fff" font-family="Arial, sans-serif" font-size="25" font-weight="700">Primary focus: Character</text>
<text x="90" y="775" fill="#bbb" font-family="Arial, sans-serif" font-size="20">Supporting: VFX + ground</text>

<!-- Grayscale -->
<rect x="825" y="130" width="720" height="690" rx="18" fill="#111" stroke="#333"/>
<text x="860" y="180" fill="#fff" font-family="Arial, sans-serif" font-size="26" font-weight="700">GRAYSCALE / VALUE CHECK</text>
<rect x="825" y="205" width="720" height="430" fill="#050505"/>
<rect x="825" y="205" width="720" height="55" fill="#555"/>
<path d="M1000 575 L1070 510 L1190 505 L1240 455 L1325 470 L1395 560 L1470 590 L1470 635 L980 635Z" fill="#777"/>
<g stroke="#eee" stroke-width="9" fill="#080808">
  <path d="M1200 300 Q1225 270 1250 300 L1243 365 L1280 430 L1265 520 L1235 510 L1220 445 L1195 515 L1165 505 L1180 425 L1200 365Z"/>
  <circle cx="1225" cy="290" r="25" fill="#111"/>
</g>
<g fill="#aaa">
  <circle cx="1315" cy="310" r="8"/><circle cx="1350" cy="350" r="6"/><circle cx="1385" cy="405" r="11"/><circle cx="1295" cy="390" r="6"/>
</g>
<rect x="1160" y="255" width="130" height="310" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="10 8"/>
<text x="860" y="690" fill="#fff" font-family="Arial, sans-serif" font-size="25" font-weight="700">Highest value contrast → character</text>
<text x="860" y="735" fill="#bbb" font-family="Arial, sans-serif" font-size="20">VFX / ground = secondary visual support</text>
<text x="860" y="775" fill="#bbb" font-family="Arial, sans-serif" font-size="20">Dark background = recedes from attention</text>
</svg>